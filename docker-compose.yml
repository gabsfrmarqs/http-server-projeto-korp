services:
  projeto-korp:
    container_name: projeto-korp
    restart: unless-stopped
    build: .
    image: http-server-projeto-korp:latest
    networks:
      - rede-projeto-korp

  proxy-nginx:
    container_name: proxy-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ${HOST_PWD:-.}/nginx/http-server-projeto-korp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - projeto-korp
    networks:
      - rede-projeto-korp

  #Seção de monitoramento
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ${HOST_PWD:-.}/ansible/files/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - rede-projeto-korp

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${HOST_PWD:-.}/ansible/files/grafana/dashboards/:/etc/grafana/provisioning/dashboards:ro
      - ${HOST_PWD:-.}/ansible/files/grafana/datasources/:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - rede-projeto-korp

networks:
  rede-projeto-korp:
    driver: bridge

volumes:
  prometheus_data: {}